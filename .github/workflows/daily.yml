name: daily-crawl

on:
  schedule:
    # 北京时间每天 08:00 与 20:00（UTC 00:00 / 12:00）
    - cron: "0 0,12 * * *"
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browser
        run: python -m playwright install chromium --with-deps

      - name: Crawl job sources
        run: python scraper/run.py

      - name: Generate webpage
        run: python scripts/gen_page.py

      - name: Send email notification
        continue-on-error: true  # SMTP Secrets 未配置或邮件失败不应阻塞数据推送
        env:
          SMTP_HOST: smtp.qq.com
          SMTP_PORT: "465"
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
        run: python scripts/send_email.py

      - name: Commit and push updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jobs.json docs/
          git commit -m "auto: daily crawl $(date +%F)" || echo "no changes to commit"
          git push
